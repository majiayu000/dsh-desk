[package]
name = "dsh-desk"
version = "0.1.0-alpha.1"
description = "A lightweight desktop shell for DeepSeek Harness"
authors = ["DSH Desk contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/majiayu000/dsh-desk"

[lib]
name = "dsh_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
