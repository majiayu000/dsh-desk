name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-contract:
    name: ${{ matrix.platform }} contract
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-15
          - platform: Windows-x64
            runner: windows-2022
          - platform: Linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 squashfs-tools xvfb x11-utils dbus-x11
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public growth surfaces
        run: pnpm test:doc-links && pnpm test:status-page
      - name: Enforce Rust formatting and lints
        run: >-
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check &&
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings
      - name: Build frontend and check Rust
        run: pnpm check
      - name: Run Rust tests
        run: pnpm test:rust
      - name: Verify signed updater contract
        run: pnpm test:updater-contract
      - name: Verify cross-device Phase A security contract
        run: pnpm test:cross-device
      - name: Verify development Harness contract
        run: pnpm test:harness-contract
      - name: Verify first-run model onboarding contract
        run: pnpm test:onboarding-contract
      - name: Assemble fixed offline runtime
        run: pnpm prepare:runtime
      - name: Verify packaged runtime contract
        run: pnpm test:packaged-runtime
      - name: Verify plugin parity
        run: pnpm test:plugin-parity
      - name: Verify reviewed plugin operands are pinned
        run: pnpm test:plugin-review
      - name: Verify plugin developer template
        run: pnpm test:plugin-template
      - name: Verify copied plugin install commands parse
        run: pnpm test:plugin-source
      - name: Verify trusted plugin catalog
        run: pnpm test:plugin-catalog
      - name: Prepare AppImage launcher permissions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Tauri copies this cached launcher into AppRun.wrapped, preserving its mode.
          # https://github.com/tauri-apps/tauri/issues/16155
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$cache_dir"
          curl --fail --location --retry 3 \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 \
            --output "$cache_dir/AppRun-x86_64.download"
          chmod 755 "$cache_dir/AppRun-x86_64.download"
          mv "$cache_dir/AppRun-x86_64.download" "$cache_dir/AppRun-x86_64"
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage --config src-tauri/tauri.unsigned-preview.json
      - name: Verify finished AppImage as a different user
        if: runner.os == 'Linux'
        run: bash scripts/test-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Upload verified Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage-${{ github.sha }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
