name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-contract:
    name: ${{ matrix.platform }} contract
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-15
          - platform: Windows-x64
            runner: windows-2022
          - platform: Linux-x64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify public growth surfaces
        run: pnpm test:doc-links && pnpm test:status-page
      - name: Build frontend and check Rust
        run: pnpm check
      - name: Run Rust tests
        run: pnpm test:rust
      - name: Verify signed updater contract
        run: pnpm test:updater-contract
      - name: Verify cross-device Phase A security contract
        run: pnpm test:cross-device
      - name: Verify development Harness contract
        run: pnpm test:harness-contract
      - name: Verify first-run model onboarding contract
        run: pnpm test:onboarding-contract
      - name: Assemble fixed offline runtime
        run: pnpm prepare:runtime
      - name: Verify packaged runtime contract
        run: pnpm test:packaged-runtime
      - name: Verify plugin parity
        run: pnpm test:plugin-parity
      - name: Verify reviewed plugin operands are pinned
        run: pnpm test:plugin-review
      - name: Verify plugin developer template
        run: pnpm test:plugin-template
      - name: Verify trusted plugin catalog
        run: pnpm test:plugin-catalog
