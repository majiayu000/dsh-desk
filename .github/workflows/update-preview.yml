name: Update-capable unsigned preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-preview
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} update preview
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each run merges its platform into the versioned release's latest.json.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            tauri_args: --bundles dmg
          - platform: windows-x64
            runner: windows-2022
            tauri_args: --bundles nsis
          - platform: linux-x64
            runner: ubuntu-24.04
            tauri_args: --bundles appimage,deb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm check:updater-key
      - name: Build and verify the fixed runtime
        run: >-
          pnpm check &&
          pnpm test:rust &&
          pnpm test:updater-contract &&
          pnpm test:onboarding-contract &&
          pnpm prepare:runtime &&
          pnpm test:packaged-runtime &&
          pnpm test:plugin-parity &&
          pnpm test:plugin-catalog
      - name: Build unsigned OS package and signed updater artifact
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: preview-v__VERSION__
          releaseName: DSH Desk unsigned update preview v__VERSION__
          releaseBody: >-
            Test-only packages without Apple Developer ID or Windows Authenticode signing.
            Updater artifacts are independently signed and use the preview channel.
          releaseDraft: false
          prerelease: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri_args }} --config src-tauri/tauri.update-preview.json

  publish-channel:
    name: Publish validated preview channel
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and validate merged update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p update-channel
          gh release download "preview-v${version}" --pattern latest.json --dir update-channel
          node scripts/validate-update-manifest.mjs update-channel/latest.json "$version"
      - name: Atomically replace preview channel metadata
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: preview-channel
          name: DSH Desk preview update channel
          body: Test-only metadata channel. Installers are not signed by Apple or Microsoft.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: update-channel/latest.json
