name: Three-platform unsigned preview

on:
  workflow_dispatch:
  push:
    branches: [build/three-platform-preview]
    paths:
      - .github/workflows/preview.yml
      - src-tauri/tauri.unsigned-preview.json

permissions:
  contents: read

concurrency:
  group: three-platform-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} unsigned preview
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            tauri_args: --bundles dmg
          - platform: macos-x64
            runner: macos-15-intel
            tauri_args: --bundles app
          - platform: windows-x64
            runner: windows-2022
            tauri_args: --bundles nsis
          - platform: linux-x64
            runner: ubuntu-22.04
            tauri_args: -vv --bundles appimage,deb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and desktop contracts
        run: >-
          pnpm check &&
          pnpm test:rust &&
          pnpm test:updater-contract &&
          pnpm test:cross-device &&
          pnpm test:harness-contract
      - name: Assemble and verify fixed offline runtime
        run: >-
          pnpm prepare:runtime &&
          pnpm test:packaged-runtime &&
          pnpm test:plugin-parity &&
          pnpm test:plugin-template
      - name: Build unsigned preview installer
        run: >-
          pnpm tauri build ${{ matrix.tauri_args }}
          --config src-tauri/tauri.unsigned-preview.json
      - name: Package Intel macOS DMG without Finder
        if: matrix.platform == 'macos-x64'
        env:
          DSH_ALLOW_ADHOC: '1'
        run: node scripts/package-macos.mjs
      - name: Write SHA-256 checksums
        run: pnpm release:checksums
      - name: Upload preview installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-desk-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.sha256
