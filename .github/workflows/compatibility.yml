name: Upstream compatibility

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned:
    name: Pinned DSH on three platforms
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS-arm64
          - runner: windows-2022
            platform: Windows-x64
          - runner: ubuntu-24.04
            platform: Linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:upstream
      - run: pnpm check
      - run: pnpm test:rust
      - run: pnpm test:harness-contract
      - run: pnpm test:onboarding-contract
      - run: pnpm prepare:runtime
      - run: pnpm test:packaged-runtime
      - run: pnpm test:plugin-parity
      - run: pnpm test:plugin-template
      - run: pnpm test:plugin-catalog

  upstream-latest:
    name: npm latest candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - id: upstream
        run: pnpm check:upstream
      - name: Install upstream candidate without committing it
        if: steps.upstream.outputs.drift == 'true'
        run: pnpm add --save-exact @deepseek-ai/dsh@${{ steps.upstream.outputs.latest }}
      - name: Exercise candidate desktop contract
        run: pnpm check && pnpm test:rust && pnpm test:harness-contract && pnpm test:onboarding-contract
      - name: Exercise candidate packaged runtime and plugins
        run: pnpm prepare:runtime && pnpm test:packaged-runtime && pnpm test:plugin-parity
